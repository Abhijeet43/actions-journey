name: context
on: push
jobs:
  context-info:
    runs-on: ubuntu-latest
    steps:
      - name: Print info
        run: |
          echo "Repository name: ${{github.repository}}"
          echo "Branch name: ${{github.ref_name}}"
          echo "Commit id: ${{github.sha}}"
          echo "Event name: ${{github.event_name}}"
          echo "Operating system: ${{runner.os}}"
